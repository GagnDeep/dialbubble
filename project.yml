name: Dialbubble
options:
  bundleIdPrefix: com.dialbubble
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CAR7LQ3Y75
targets:
  Dialbubble:
    type: application
    platform: iOS
    sources:
      - path: Dialbubble
    info:
      path: Dialbubble/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.dialbubble.refresh]
    settings:
      base:
        DEVELOPMENT_TEAM: CAR7LQ3Y75
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Dialbubble
        PRODUCT_BUNDLE_IDENTIFIER: com.dialbubble.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dialbubble
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Dialbubble uses Face ID to keep your Twilio account locked."
        INFOPLIST_KEY_NSContactsUsageDescription: "Dialbubble shows your contacts' names instead of phone numbers in calls and messages. Your contacts never leave this iPhone."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  DialbubbleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DialbubbleTests
    dependencies:
      - target: Dialbubble
    settings:
      base:
        DEVELOPMENT_TEAM: CAR7LQ3Y75
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.dialbubble.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dialbubble.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dialbubble"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DialbubbleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DialbubbleUITests
    dependencies:
      - target: Dialbubble
    settings:
      base:
        DEVELOPMENT_TEAM: CAR7LQ3Y75
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.dialbubble.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dialbubble
schemes:
  Dialbubble:
    build:
      targets:
        Dialbubble: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DialbubbleTests
        - DialbubbleUITests
    archive:
      config: Release
